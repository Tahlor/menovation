# Menovation Offline App & Streaming Proxy to Pi3 with Universal SSO & Configurable 3GB Caching
location = /menovation { return 301 /menovation/; }

# SSO Auth subrequest for Menovation
location = /_menovation_auth {
    internal;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Auth-Request-User "";
    proxy_pass http://127.0.0.1:5050/sso/auth-request;
}

location @menovation_login {
    add_header Cache-Control "no-store" always;
    return 302 /sso/login?return_url=$scheme://$host$request_uri;
}

location @menovation_unavailable {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 503 "Menovation SSO authorization service unavailable";
}

# Cached Video Streaming with 2MB slice chunking
location ^~ /menovation/videos/ {
    auth_request /_menovation_auth;
    error_page 401 403 = @menovation_login;
    error_page 500 502 503 504 = @menovation_unavailable;

    slice 2m;
    proxy_cache menovation_cache;
    proxy_cache_key $uri$is_args$args$slice_range;
    proxy_set_header Range $slice_range;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8085/videos/;
    proxy_cache_valid 200 206 30d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Access-Control-Allow-Origin * always;
}

# Cached Exercise Demonstration GIFs
location ^~ /menovation/gifs/ {
    auth_request /_menovation_auth;
    error_page 401 403 = @menovation_login;
    error_page 500 502 503 504 = @menovation_unavailable;

    proxy_pass http://127.0.0.1:8085/gifs/;
    proxy_http_version 1.1;
    proxy_cache menovation_cache;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_read_timeout 60s;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Access-Control-Allow-Origin * always;
    expires 30d;
}

# Web App Shell & Assets
location ^~ /menovation/ {
    auth_request /_menovation_auth;
    auth_request_set $menovation_identity $upstream_http_x_auth_request_user;
    error_page 401 403 = @menovation_login;
    error_page 500 502 503 504 = @menovation_unavailable;

    proxy_pass http://127.0.0.1:8085/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-Request-User $menovation_identity;
    add_header Access-Control-Allow-Origin * always;
}
